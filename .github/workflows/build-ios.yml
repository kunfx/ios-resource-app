name: Build iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      admin_base_url:
        description: '后台 HTTPS 根域名（留空使用 App.xcconfig）'
        required: false
        type: string
      bundle_identifier:
        description: 'Bundle Identifier（留空使用 App.xcconfig）'
        required: false
        type: string
      url_scheme:
        description: '独立 URL Scheme（留空使用 App.xcconfig）'
        required: false
        type: string
  push:
    paths: ['ios-app/**', '.github/workflows/build-ios.yml']
  pull_request:
    paths: ['ios-app/**', '.github/workflows/build-ios.yml']

permissions:
  contents: read

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ADMIN_INPUT: ${{ inputs.admin_base_url }}
      BUNDLE_INPUT: ${{ inputs.bundle_identifier }}
      SCHEME_INPUT: ${{ inputs.url_scheme }}
    steps:
      - uses: actions/checkout@v4
      - name: Show installed Xcode and SDKs
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate sources and bridge behavior
        run: |
          node ios-app/Tests/validate-project.mjs
          node --test ios-app/Tests/AdminBridge.test.mjs
          plutil -lint ios-app/IfengAdmin/Info.plist
          plutil -lint ios-app/IfengAdmin.xcodeproj/project.pbxproj

      - name: Test native URL parsing and navigation policy
        run: |
          mkdir -p "$RUNNER_TEMP/ifeng-tests"
          swiftc ios-app/IfengAdmin/App/AppConfiguration.swift \
            ios-app/IfengAdmin/URLHandler/DeepLink.swift \
            ios-app/IfengAdmin/URLHandler/NavigationPolicy.swift \
            ios-app/Tests/main.swift -o "$RUNNER_TEMP/ifeng-tests/url-tests"
          "$RUNNER_TEMP/ifeng-tests/url-tests"

      - name: Build unsigned Release application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-app/build
          # 输入通过环境变量传入，不把用户文本直接插入 shell 源码。
          # 使用位置参数兼容 macOS Bash 3.2；空的 "$@" 也可在 set -u 下安全展开。
          set --
          if [[ -n "${ADMIN_INPUT:-}" ]]; then
            set -- "$@" "ADMIN_BASE_URL=$ADMIN_INPUT"
          fi
          if [[ -n "${BUNDLE_INPUT:-}" ]]; then
            set -- "$@" "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_INPUT"
          fi
          if [[ -n "${SCHEME_INPUT:-}" ]]; then
            set -- "$@" "APP_URL_SCHEME=$SCHEME_INPUT"
          fi
          xcodebuild -project ios-app/IfengAdmin.xcodeproj -scheme IfengAdmin \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios-app/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            "$@" build 2>&1 | tee ios-app/build/xcodebuild.log

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="ios-app/build/DerivedData/Build/Products/Release-iphoneos/IfengAdmin.app"
          test -d "$app"
          test -f "$app/IfengAdmin"
          test -f "$app/AdminBridge.js"
          test -f "$app/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          # 明确检查产物没有可安装签名，绝不将构建成功称为签名完成。
          # 某些工具链会给可执行文件附加 ad-hoc 签名；移除后仍需另行正式签名。
          if codesign --verify "$app" >/dev/null 2>&1; then
            codesign --remove-signature "$app/IfengAdmin"
          fi
          if codesign --verify "$app" >/dev/null 2>&1; then exit 1; fi
          test ! -e "$app/embedded.mobileprovision"
          mkdir -p ios-app/build/package/Payload
          ditto "$app" ios-app/build/package/Payload/IfengAdmin.app
          (cd ios-app/build/package && /usr/bin/zip -qry ../IfengAdmin-unsigned.ipa Payload)
          unzip -t ios-app/build/IfengAdmin-unsigned.ipa
          shasum -a 256 ios-app/build/IfengAdmin-unsigned.ipa > ios-app/build/SHA256SUMS.txt
          echo '未签名 IPA 已生成，安装前必须另行合法签名。' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: IfengAdmin-unsigned-${{ github.run_number }}
          path: |
            ios-app/build/IfengAdmin-unsigned.ipa
            ios-app/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IfengAdmin-build-log-${{ github.run_number }}
          path: ios-app/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

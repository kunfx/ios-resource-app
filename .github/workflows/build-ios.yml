name: Build iOS IPA

# 在 GitHub Actions 的 macOS Runner 上编译 Release，输出未签名 IPA。
# 未签名 IPA 不能直接安装到 iPhone，需要用 ESign / 自签工具或开发者证书重新签名。
#
# 关于 Liquid Glass：
#   底部 Dock 用的是 iOS 26 的官方 API `View.glassEffect(_:in:)`，源码里已经用
#   `#if compiler(>=6.2)` + `#available(iOS 26.0, *)` 双重保护。
#   - Runner 上有 Xcode 26 → 走官方玻璃效果；
#   - 只有 Xcode 16 → 自动回退到材质实现，照样能编译出包，只是玻璃不是系统级。
#   所以这里会主动挑最新的一版 Xcode，尽量拿到 iOS 26 SDK。

on:
  push:
    branches:
      - main
      - master
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          echo "=== 已安装的 Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          BEST=$(python3 - <<'PY'
          import glob, re
          candidates = []
          for path in glob.glob("/Applications/Xcode*.app"):
              match = re.search(r"Xcode[ _]?([0-9]+(?:\.[0-9]+)*)", path)
              if match:
                  version = tuple(int(part) for part in match.group(1).split("."))
                  candidates.append((version, path))
          print(max(candidates)[1] if candidates else "")
          PY
          )

          if [ -n "${BEST:-}" ]; then
            echo "使用：$BEST"
            sudo xcode-select -s "$BEST"
          else
            echo "未找到可选 Xcode，沿用默认。"
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          xcode-select -p

      - name: Regenerate Xcode project
        working-directory: ios-app
        run: |
          # 保证新增的 .swift 一定被纳入编译，不依赖本地是否记得重跑脚本。
          python3 tools/make_xcodeproj.py

      - name: Validate project
        working-directory: ios-app
        run: |
          set -o pipefail
          if xcodebuild -list -project IfengAdmin.xcodeproj > /tmp/list.log 2>&1; then
            cat /tmp/list.log
            exit 0
          fi
          echo "::warning::Generated Xcode project could not be read; falling back to XcodeGen."
          cat /tmp/list.log || true
          brew install xcodegen
          xcodegen generate
          xcodebuild -list -project IfengAdmin.xcodeproj

      - name: Build Release (unsigned)
        working-directory: ios-app
        run: |
          set -o pipefail
          # 关于下面三个编译开关（很重要，别删）：
          #
          # Release 默认是 `-O -whole-module-optimization`，会把全部源文件
          # 塞进**同一个 swift-frontend 进程**做优化。GitHub 的 macos-15
          # runner 只有 7GB 内存，这个组合会把内存打满，然后进程被内核
          # 直接 SIGKILL —— 表现就是日志里只有一句
          #   Failed frontend command: <一长串 swiftc 参数>
          #   Command SwiftCompile failed with a nonzero exit code
          # 既没有 `error:` 也没有 `Stack dump:`，非常难排查。
          #
          # SWIFT_COMPILATION_MODE=incremental  逐文件编译，内存峰值大降
          # SWIFT_ENABLE_BATCH_MODE=NO          每个文件单独起一个 frontend
          # SWIFT_ENABLE_DEFAULT_CMO=NO         关掉跨模块优化，进一步省内存
          #
          # 代价只是二进制稍微不那么极致优化，对内部客服 App 完全无所谓。
          xcodebuild \
            -project IfengAdmin.xcodeproj \
            -scheme IfengAdmin \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_COMPILATION_MODE=incremental \
            SWIFT_ENABLE_BATCH_MODE=NO \
            SWIFT_ENABLE_DEFAULT_CMO=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee /tmp/build.log

      - name: Package unsigned IPA
        working-directory: ios-app
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/IfengAdmin.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Build product not found at $APP_PATH"
            ls -R build/Build/Products || true
            exit 1
          fi

          rm -rf Payload IfengAdmin-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf "Payload/IfengAdmin.app/_CodeSignature"
          /usr/bin/zip -qry IfengAdmin-unsigned.ipa Payload

          echo "=== IPA 内容检查 ==="
          unzip -l IfengAdmin-unsigned.ipa | head -20
          ls -lh IfengAdmin-unsigned.ipa

          echo "=== Info.plist 关键配置 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/IfengAdmin.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Payload/IfengAdmin.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "Payload/IfengAdmin.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "Payload/IfengAdmin.app/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :DefaultServerURL" "Payload/IfengAdmin.app/Info.plist" || true

          echo "=== 代码签名状态（应为未签名）==="
          codesign -dv "Payload/IfengAdmin.app" 2>&1 || echo "unsigned (expected)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IfengAdmin-unsigned-ipa
          path: ios-app/IfengAdmin-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /tmp/build.log
            /tmp/list.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "### 构建失败"
            echo ""
            echo "完整日志见 Artifact \`build-log\`。"
            echo ""
            echo "#### 错误 / 崩溃标记"
            echo ""
            echo '```'
            # `Failed frontend command` 是 swift-frontend 异常终止的标志：
            # 后面没有 Stack dump 也没有 error:，通常是被内核 OOM 杀掉。
            grep -E "error:|Failed frontend command|Stack dump|Please submit a bug report|Killed|signal|BUILD FAILED" /tmp/build.log 2>/dev/null | head -40 || true
            echo '```'
            echo ""
            echo "#### 日志末尾 50 行"
            echo ""
            echo '```'
            tail -50 /tmp/build.log 2>/dev/null || echo "(build.log 不存在)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

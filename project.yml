name: IfengAdmin

options:
  bundleIdPrefix: com.ifeng
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  IfengAdmin:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: IfengAdmin
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ifeng.admin
        PRODUCT_NAME: IfengAdmin
        INFOPLIST_FILE: IfengAdmin/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

# 显式声明 scheme，保证 XcodeGen 兜底生成时 xcodebuild -scheme IfengAdmin 依然可用。
schemes:
  IfengAdmin:
    build:
      targets:
        IfengAdmin: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

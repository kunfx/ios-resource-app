name: Build iOS IPA

# 在 GitHub Actions 的 macOS Runner 上用系统 Xcode 编译 Release，输出未签名 IPA。
# 未签名 IPA 不能直接安装到 iPhone，需要用 ESign / 自签工具或开发者证书重新签名。

on:
  push:
    branches:
      - main
      - master
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          xcode-select -p

      - name: Validate project
        working-directory: ios-app
        run: |
          set -o pipefail
          if xcodebuild -list -project IfengAdmin.xcodeproj > /tmp/list.log 2>&1; then
            cat /tmp/list.log
            exit 0
          fi
          echo "::warning::Committed Xcode project could not be read; regenerating with XcodeGen."
          cat /tmp/list.log || true
          brew install xcodegen
          xcodegen generate
          xcodebuild -list -project IfengAdmin.xcodeproj

      - name: Build Release (unsigned)
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild \
            -project IfengAdmin.xcodeproj \
            -scheme IfengAdmin \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee /tmp/build.log

      - name: Package unsigned IPA
        working-directory: ios-app
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/IfengAdmin.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Build product not found at $APP_PATH"
            ls -R build/Build/Products || true
            exit 1
          fi

          rm -rf Payload IfengAdmin-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf "Payload/IfengAdmin.app/_CodeSignature"
          /usr/bin/zip -qry IfengAdmin-unsigned.ipa Payload

          echo "=== IPA 内容检查 ==="
          unzip -l IfengAdmin-unsigned.ipa | head -20
          ls -lh IfengAdmin-unsigned.ipa

          echo "=== Info.plist 关键配置 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/IfengAdmin.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Payload/IfengAdmin.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "Payload/IfengAdmin.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "Payload/IfengAdmin.app/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :DefaultServerURL" "Payload/IfengAdmin.app/Info.plist" || true

          echo "=== 代码签名状态（应为未签名）==="
          codesign -dv "Payload/IfengAdmin.app" 2>&1 || echo "unsigned (expected)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IfengAdmin-unsigned-ipa
          path: ios-app/IfengAdmin-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /tmp/build.log
            /tmp/list.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Failure summary
        if: failure()
        run: |
          echo "### 构建失败" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "完整日志见本步骤上方输出，以及 Artifact \`build-log\`。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/build.log ]; then
            grep -E "error:|warning: .*deprecated|BUILD FAILED" /tmp/build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

# XcodeGen 描述文件 —— 仅作为兜底。
#
# 正常路径是 `python3 tools/make_xcodeproj.py` 生成 IfengAdmin.xcodeproj（已入库）。
# 万一 pbxproj 被改坏、或者想换一种方式重建工程，CI 会自动 `brew install xcodegen`
# 然后用这个文件生成一份等价的工程。
#
# 本地重建：
#   brew install xcodegen && xcodegen generate

name: IfengAdmin

options:
  minimumXcodeGenVersion: "2.38.0"
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  IfengAdmin:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: IfengAdmin
        excludes:
          # Info.plist 走 INFOPLIST_FILE，不能再进 Resources，否则会重复产出。
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ifeng.admin
        PRODUCT_NAME: IfengAdmin
        INFOPLIST_FILE: IfengAdmin/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES

schemes:
  IfengAdmin:
    build:
      targets:
        IfengAdmin: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

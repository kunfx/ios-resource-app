name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      version:
        description: '营销版本号（CFBundleShortVersionString）'
        required: false
        default: '1.0.0'
      build:
        description: '构建号（CFBundleVersion）'
        required: false
        default: '1'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AppKu (unsigned)
    runs-on: macos-15
    timeout-minutes: 30

    env:
      SCHEME: AppKu
      PROJECT_DIR: ios
      APP_NAME: AppKu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          sw_vers

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          ls -la

      - name: Build (no code signing)
        working-directory: ios
        env:
          MARKETING_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
          BUILD_NUMBER: ${{ github.event.inputs.build || github.run_number }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${SCHEME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            VALIDATE_PRODUCT=NO

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "${APP_PATH}" ]; then
            echo "未找到 .app 产物，构建失败"
            exit 1
          fi

          echo "找到产物: ${APP_PATH}"

          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "${APP_PATH}" Payload/

          # 未签名 ipa 必须用 zip 保留符号链接与权限
          zip -qry "dist/${APP_NAME}-unsigned.ipa" Payload

          echo "--- 产物信息 ---"
          ls -lh "dist/${APP_NAME}-unsigned.ipa"
          unzip -l "dist/${APP_NAME}-unsigned.ipa" | head -20
          plutil -p "Payload/${APP_NAME}.app/Info.plist" | head -30 || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ios/dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload dSYM (optional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-dSYM
          path: ios/build/Build/Products/Release-iphoneos/*.app.dSYM
          if-no-files-found: ignore
          retention-days: 7
